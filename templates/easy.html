{% extends "layout.html" %}
{% block title %}Tic Tac Toe: Easy Mode{% endblock %}
{% block body %}
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: black;
    }

    .background {
        margin: 0 auto;
        font-family: Itim;
        display: grid;
        grid-template-columns: 100px 100px 100px;
        grid-template-rows: 100px 100px 100px;
        max-width: 300px;
        max-height: 300px;
        cursor: pointer;
    }

    header,
    footer {
        background-color: black;
        color: white;
    }

    .square {
        border: 2px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 48px;
        font-family: Itim;
        color: white;
    }

    #reset {
        align-items: center;
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    #record {
        color: white;
        align-items: end;
        margin-left: 10px auto;
    }
</style>
<header>
    <h1>Tic Tac Toe: Easy Mode</h1>
    <br>
</header>
<main class="background">
    <div class="square" id="0"></div>
    <div class="square" id="1"></div>
    <div class="square" id="2"></div>
    <div class="square" id="3"></div>
    <div class="square" id="4"></div>
    <div class="square" id="5"></div>
    <div class="square" id="6"></div>
    <div class="square" id="7"></div>
    <div class="square" id="8"></div>
    <button id="reset">Reset</button>
    <h3 id="record"></h3>
</main>
<script>
    wins = 0;
    losses = 0;
    draws = 0;
    board = ['', '', '', '', '', '', '', '', ''];
    gameOver = false;
    const winningCombinations = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
    ]

    function checkWin() {
        for (let combination of winningCombinations) {
            if (board[combination[0]] == board[combination[1]] && board[combination[2]] == board[combination[0]]
                && board[combination[0]] !== '') {
                alert("Player " + board[combination[0]] + " wins!");
                if (board[combination[0]] === 'X') {
                    wins += 1;
                } else {
                    losses += 1;
                }
                document.getElementById('record').innerHTML = `Wins: ${wins} Draws: ${draws} Losses: ${losses}`
                gameOver = true;
                return true;
            }
        }
    }

    function checkDraw() {
        if (board.every(square => square !== '')) {
            gameOver = true;
            alert("It's a draw!");
            draws += 1;
            document.getElementById('record').innerHTML = `Wins: ${wins} Draws: ${draws} Losses: ${losses}`
            return true;
        }
        return false;
    }

    function aiMove() {
        let availableMoves = [];
        for (let i = 0; i < board.length; i++) {
            if (board[i] === '') {
                availableMoves.push(i);
            }
        }
        index = availableMoves[Math.floor(Math.random() * availableMoves.length)];
        board[index] = 'O'
        document.getElementById(index).textContent = "O"
        return;
    }
    tiles = document.querySelectorAll('.square');
    for (let tile of tiles) {
        tile.addEventListener('click', function (event) {
            if (gameOver) return;
            let index = parseInt(event.target.id);
            if (board[index] !== '') {
                alert("This square is already taken. Choose another one.");
            }
            else {
                board[index] = 'X'
                tile.textContent = 'X';
                if (checkWin()) return;
                if (checkDraw()) return;
                aiMove();
                if (checkWin()) return;
                if (checkDraw()) return;
            }
        });
    }
    document.getElementById('reset').addEventListener('click', function () {
        board = ['', '', '', '', '', '', '', '', ''];
        for (let tile of tiles) {
            tile.textContent = '';
        }
        gameOver = false;
        currentPlayer = 'X';
    });
</script>
{% endblock %}
